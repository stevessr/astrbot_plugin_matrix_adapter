name: Stable Matrix protocol regressions

on:
  pull_request:
    branches:
      - dev
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/stable-protocol-tests.yml"
  push:
    branches:
      - dev
      - "feat/stable-msc-*"
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/stable-protocol-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install protocol-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            aiohttp \
            anyio \
            bleach \
            cryptography \
            markdown-it-py \
            Pillow \
            qrcode \
            vodozemac

      - name: Compile protocol-facing modules
        run: |
          python -m compileall -q \
            auth client constants e2ee processors receiver sender sync utils \
            room_topic.py

      - name: Run versioned stable protocol regressions
        run: |
          python -m unittest discover -s tests/unit -p 'test_matrix_v*_stable.py' -v

      - name: Run shared stable protocol regressions
        run: |
          python -m unittest \
            tests.unit.test_matrix_stable_auth \
            tests.unit.test_matrix_stable_msc \
            -v
