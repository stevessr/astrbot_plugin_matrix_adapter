name: Patch v1.1 request fixtures v2

on:
  push:
    branches: [feat/stable-followup-qr-e2ee]
    paths: [.github/workflows/patch-v101-request-fixtures-v2.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/stable-followup-qr-e2ee
      - name: Patch fixtures
        run: echo '' | base64 -d | python3
      - name: Commit
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/unit/test_matrix_new_spec_compat.py
          git commit -m 'test(e2ee): add stable verification request timestamps'
          git push origin HEAD:feat/stable-followup-qr-e2ee
